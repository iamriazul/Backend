<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weather App ⛅</h1>
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter City Name" autocomplete="off">
      <button id="searchBtn">SEARCH</button>
    </div>

    <!-- FIX 1: Added missing loading div -->
    <div id="loading" class="hidden">⏳ Loading...</div>

    <!-- FIX 2: Fixed typo "hiden" → "hidden" -->
    <div id="errorMessage" class="hidden"></div>

    <!-- Weather data display -->
    <div id="weatherInfo" class="hidden">
      <h2 id="cityName"></h2>

      <div class="weather-main">
        <div class="temperature">
          <span id="temp"></span>
          <span class="unit">°C</span>
        </div>
        <div class="description" id="description"></div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <span class="label">Feels Like:</span>
          <span id="feelsLike"></span>
        </div>
        <div class="detail-item">
          <span class="label">Humidity:</span>
          <span id="humidity"></span>
        </div>
        <div class="detail-item">
          <span class="label">Wind Speed:</span>
          <span id="windSpeed"></span>
        </div>
        <div class="detail-item">
          <span class="label">Pressure:</span>
          <span id="pressure"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- FIX 3: Renamed server.js → script.js (server.js is a Node.js convention, not browser JS) -->
  <script src="server.js"></script>
</body>
</html>
